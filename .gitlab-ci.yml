include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.07.12
    file:
      - '/ci-templates/design-drift.yml'
      - '/ci-templates/parser-parity.yml'
      - '/ci-templates/removed-symbols.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/github-mirror.yml'
      - '/ci-templates/vrt-upload.yml'

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.07.12"
  SAST_EXCLUDED_PATHS: "bin/, obj/, packages/"
  SECRET_DETECTION_EXCLUDED_PATHS: "bin/, obj/, packages/"
  SAST_ANALYZER_IMAGE_TAG: "5"

stages:
  - lint
  - build
  - test
  - security
  - deploy

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger"

default:
  interruptible: true

# Shared CABI download-and-verify logic, invoked via !reference from
# before_script in any job that needs vauchi_cabi.dll. Consolidated
# 2026-04-22 (T3.3 of 2026-04-22-windows-main-pipeline-speed) — the
# separate download:cabi job spent ~4 min on SaaS Windows runner
# cold-start for ~20 s of real work, and every consumer had to pay
# that tax via the `needs:` graph. Moving the download into the
# before_script of the jobs that need it removes one cold-start from
# the critical path.
#
# Still internally idempotent (SHA-skip on existing DLL) so repeated
# calls in parallel jobs that share a runner disk are safe. Still
# keyed on cabi-version.json for the cache slot, so repeated runs
# with the same cabi version reuse the cached DLL.
.cabi-download-script:
  script:
    - |
      $config = Get-Content cabi-version.json | ConvertFrom-Json
      if ($config.version -eq "0.0.0") {
        Write-Host "CABI version is placeholder (0.0.0) — skipping download"
        exit 0
      }

      # Skip if DLL already matches expected hash (from cache or prior job)
      if (Test-Path cabi/vauchi_cabi.dll) {
        $actual = (Get-FileHash cabi/vauchi_cabi.dll -Algorithm SHA256).Hash.ToLower()
        if ($actual -eq $config.sha256) {
          Write-Host "CABI DLL already up to date ($($config.version))"
          return
        }
      }

      New-Item -ItemType Directory -Force -Path cabi | Out-Null
      # Hardcoded core project ID (77874344) — eliminates dependency on
      # VAUCHI_CORE_PROJECT_ID CI variable which is protected (empty on MR pipelines).
      $base = "$env:CI_API_V4_URL/projects/77874344/packages/generic/vauchi-cabi-windows/$($config.version)"

      Write-Host "Downloading vauchi_cabi.dll v$($config.version)..."
      Write-Host "URL base: $base"
      # Use curl.exe with HTTP Basic Auth (gitlab-ci-token:<JOB_TOKEN>).
      # JOB-TOKEN header triggers 308 redirect to CDN which may 404;
      # Basic Auth avoids the CDN redirect path entirely.
      $curlAuth = "gitlab-ci-token:$env:CI_JOB_TOKEN"
      foreach ($file in @("vauchi_cabi.dll", "vauchi_cabi.dll.sha256", "vauchi_cabi.dll.sha256.bundle")) {
        $attempt = 0
        $ok = $false
        while ($attempt -lt 3 -and -not $ok) {
          $attempt++
          Write-Host "  $file (attempt $attempt)..."
          curl.exe -fSL -u $curlAuth --retry 2 -o "cabi/$file" "$base/$file"
          if ($LASTEXITCODE -eq 0) { $ok = $true } else {
            Write-Host "  Failed (exit $LASTEXITCODE), retrying..."
            Start-Sleep -Seconds 2
          }
        }
        if (-not $ok) {
          Write-Error "Failed to download $file after 3 attempts"
          exit 1
        }
      }

      # Install cosign
      $COSIGN_VERSION = "v3.0.5"
      $COSIGN_URL = "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-windows-amd64.exe"
      curl.exe -fSL --retry 2 -o cosign.exe $COSIGN_URL

      # Verify cosign signature
      Write-Host "Verifying cosign signature..."
      & .\cosign.exe verify-blob --key cosign.pub --bundle cabi/vauchi_cabi.dll.sha256.bundle cabi/vauchi_cabi.dll.sha256
      if ($LASTEXITCODE -ne 0) {
        Write-Error "Cosign verification FAILED"
        exit 1
      }
      Write-Host "Cosign signature verified"

      # Verify SHA-256
      $actual = (Get-FileHash cabi/vauchi_cabi.dll -Algorithm SHA256).Hash.ToLower()
      if ($actual -ne $config.sha256) {
        Write-Error "SHA-256 mismatch: expected $($config.sha256), got $actual"
        exit 1
      }
      Write-Host "SHA-256 verified: $actual"

# T2.5 — proves pam before any real job is routed to it (runbook §7.2).
#
# Pinned to the IDENTITY tag, never the capability tags. `[windows,
# dotnet]` asks GitLab for *some* Windows runner, so a probe using those
# can pass by reaching a different machine while pam is wedged — the
# mirror image of why pam deliberately carries no `self-hosted` tag.
# Same rationale as `canary-allyson-*` in `_private/.gitlab-ci.yml`.
#
# Checks the §1 toolchain preconditions rather than just "a shell ran".
# The MakeAppx path is literal and hardcoded in `package:msix`; the
# runbook notes that a missing SDK there "fails only at tag time — the
# worst moment to discover it". This surfaces it on demand instead.
#
# Manual and allow_failure on purpose: pam has no health-check timer
# (runbook §9), so this doubles as the on-demand liveness probe, and a
# wedged or offline pam must not block unrelated merge requests.
check:pam-toolchain:
  stage: .pre
  needs: []
  tags: [canary-pam-shell]
  when: manual
  allow_failure: true
  timeout: 5 minutes
  variables:
    GIT_STRATEGY: none
  script:
    # One run reports EVERY gap, not the first. Checking tools one at a
    # time cost six runs to find two gaps during pam's provisioning:
    # each failure hid the next. Deliberately plain PowerShell so this
    # behaves the same under Desktop 5.1 and pwsh 7 — the shell itself is
    # one of the things being checked.
    - |
      $missing = @()
      Write-Host "probe on $env:COMPUTERNAME as $env:USERNAME at $(Get-Date -Format o)"
      Write-Host "shell: $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"

      # The probe reaches pam by its identity tag, so it says nothing
      # about whether pam also carries the capability tags the real jobs
      # ask for. Without this check a green probe reads as "pam is ready"
      # while every retagged job sits in stuck_pending_no_matching_runners
      # — which is exactly what job 16460782323 did.
      #
      # CI_RUNNER_TAGS is a JSON array, not a comma-separated list.
      # Splitting it on "," yields '["powershell"' and ' "windows"' and
      # matches nothing, which reads as a missing tag that is present.
      Write-Host "runner tags: $env:CI_RUNNER_TAGS"
      $runnerTags = @()
      if ($env:CI_RUNNER_TAGS) {
        try {
          $runnerTags = @($env:CI_RUNNER_TAGS | ConvertFrom-Json)
        } catch {
          $runnerTags = @($env:CI_RUNNER_TAGS -split ',' | ForEach-Object { $_.Trim() })
        }
      }
      foreach ($needed in @('windows', 'dotnet')) {
        if ($runnerTags -contains $needed) {
          Write-Host "OK       carries the '$needed' capability tag"
        } else {
          Write-Host "MISSING  '$needed' capability tag"
          $missing += "the '$needed' runner tag - every job here asks for it, so its absence is stuck_pending_no_matching_runners, not a build error. Add it in GitLab: Settings > CI/CD > Runners > pam-shell > Edit. The probe's own identity tag cannot substitute."
        }
      }

      # §0: the three UI jobs drive a real WinUI window, which needs an
      # interactive session. Session 0 is the service/non-interactive
      # session and has no desktop — UI automation there does not fail
      # loudly, it sees an empty desktop or hangs until the job times
      # out. Running as the right ACCOUNT does not prove this; a service
      # configured with a user account still lands in session 0.
      $session = (Get-Process -Id $PID).SessionId
      if ($session -eq 0) {
        Write-Host "SESSION 0  no desktop — test:snapshots and test:a11y would hang or capture an empty screen"
        $uiBlocked = "interactive session (runner is in session 0; see runbook §0, §2, §6)"
      } else {
        Write-Host "OK       interactive session $session"
        $uiBlocked = $null
      }
      Write-Host "PATH:"
      $env:PATH -split ';' | Where-Object { $_ } | ForEach-Object { Write-Host "  $_" }

      # A tool can be absent, or present but unreachable on PATH. Those
      # need different fixes, so report which one it is.
      function Probe($name, $cmd, $knownPath) {
        $onPath = Get-Command $cmd -ErrorAction SilentlyContinue
        if ($onPath) {
          Write-Host "OK       $name -> $($onPath.Source)"
          return $null
        }
        if ($knownPath -and (Test-Path $knownPath)) {
          Write-Host "NOT ON PATH  $name exists at $knownPath but is not resolvable"
          return "$name (installed, not on PATH - add its directory to the MACHINE PATH, then restart the runner task)"
        }
        Write-Host "MISSING  $name"
        return "$name (not installed)"
      }

      $missing += Probe "dotnet" "dotnet" "C:\Program Files\dotnet\dotnet.exe"
      $missing += Probe "pwsh"   "pwsh"   "C:\Program Files\PowerShell\7\pwsh.exe"
      $missing += Probe "git"    "git"    "C:\Program Files\Git\cmd\git.exe"

      # package:msix hardcodes this literal path; the runbook notes a
      # missing SDK there "fails only at tag time - the worst moment to
      # discover it".
      $makeappx = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\MakeAppx.exe"
      $msixOnly = @()
      if (Test-Path $makeappx) {
        Write-Host "OK       MakeAppx -> $makeappx"
      } else {
        Write-Host "MISSING  MakeAppx at $makeappx"
        $msixOnly += "Windows SDK 10.0.22621 (MakeAppx.exe)"
      }

      # .NET 8 specifically: every csproj targets net8.0-windows10.0.22621.0.
      # A newer SDK alone builds it but cannot run the tests.
      if (Get-Command dotnet -ErrorAction SilentlyContinue) {
        $sdks = & dotnet --list-sdks
        $sdks | ForEach-Object { Write-Host "  sdk: $_" }
        if (-not ($sdks | Select-String '^8\.')) {
          $missing += ".NET 8 SDK - every csproj targets net8.0-windows10.0.22621.0"
        }

        # An SDK that cannot reach a package feed builds nothing. The repo
        # carries no nuget.config, so restore uses whatever sources this
        # ACCOUNT has - and a freshly provisioned account has none. That is
        # NU1100 "Unable to resolve" on every package, including Microsoft's
        # own runtime packs, with no source named in the message; a source
        # that exists but is unreachable is NU1301 instead.
        $sources = & dotnet nuget list source
        $sources | ForEach-Object { Write-Host "  nuget: $_" }
        if (-not ($sources | Select-String '\[Enabled\]')) {
          $missing += "a NuGet package source - 'dotnet nuget list source' reports none enabled for this account, so every restore fails NU1100. Fix: dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org"
        }
      }

      # @() forces an array: a single result is a scalar in 5.1 and
      # .Count on it is unreliable.
      $missing  = @($missing | Where-Object { $_ })
      $msixOnly = @($msixOnly | Where-Object { $_ })
      $uiOnly   = @($uiBlocked | Where-Object { $_ })

      Write-Host ""
      # Report by what each gap actually blocks. A missing Windows SDK is
      # not a reason to hold T3.1, and an unusable desktop is not a reason
      # to hold it either — conflating them stalls the whole migration on
      # the least urgent gap.
      if ($missing.Count -gt 0) {
        Write-Host "=== BLOCKS every job on pam ($($missing.Count)): ==="
        $missing | ForEach-Object { Write-Host "  - $_" }
      }
      if ($uiOnly.Count -gt 0) {
        Write-Host "=== BLOCKS the UI jobs only, T3.2 ($($uiOnly.Count)): ==="
        $uiOnly | ForEach-Object { Write-Host "  - $_" }
      }
      if ($msixOnly.Count -gt 0) {
        Write-Host "=== BLOCKS package:msix only, T3.3 ($($msixOnly.Count)): ==="
        $msixOnly | ForEach-Object { Write-Host "  - $_" }
        Write-Host "    (T3.3 is gated on the signing decision regardless — see"
        Write-Host "     backlog/2026-09-11-windows-dual-track-msix-packaging)"
      }

      if ($missing.Count -eq 0 -and $uiOnly.Count -eq 0 -and $msixOnly.Count -eq 0) {
        Write-Host "=== pam has everything the windows jobs need ==="
        exit 0
      }

      Write-Host ""
      Write-Host "Provisioning contract: _private/infra/runners/pam-windows-setup.md"
      Write-Host "Installing a tool does NOT update an already-running runner's PATH;"
      Write-Host "restart the scheduled task after any install."
      exit 1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:app:
  stage: build
  needs: []
  cache:
    key:
      files:
        - cabi-version.json
    paths:
      - cabi/
    policy: pull-push
  before_script:
    - !reference [.cabi-download-script, script]
  script:
    # PRI tooling disabled: SaaS runners lack Visual Studio's
    # Microsoft.Build.Packaging.Pri.Tasks.dll. Unpackaged WinUI apps
    # don't need PRI at runtime (XAML loads from loose .xbf files).
    - dotnet build Vauchi.sln -c Release -p:EnableCoreMrtTooling=false -p:AppxGeneratePriEnabled=false
    - |
      # Report binary sizes for Grafana tracking
      $outDir = "Vauchi\bin\x64\Release\net8.0-windows10.0.22621.0\win-x64"
      $exe = Get-Item "$outDir\Vauchi.exe" -ErrorAction SilentlyContinue
      $dll = Get-Item "$outDir\Vauchi.dll" -ErrorAction SilentlyContinue
      $cabi = Get-Item "cabi\vauchi_cabi.dll" -ErrorAction SilentlyContinue
      $metrics = @{}
      if ($exe) { $metrics["vauchi_binary_size_bytes{component=`"exe`",platform=`"windows`"}"] = $exe.Length }
      if ($dll) { $metrics["vauchi_binary_size_bytes{component=`"app_dll`",platform=`"windows`"}"] = $dll.Length }
      if ($cabi) { $metrics["vauchi_binary_size_bytes{component=`"cabi_dll`",platform=`"windows`"}"] = $cabi.Length }
      # Print to job log + save as artifact
      $promText = ($metrics.GetEnumerator() | ForEach-Object { "$($_.Key) $($_.Value)" }) -join "`n"
      Write-Host $promText
      $metrics | ConvertTo-Json | Set-Content metrics.json
      # Push to Prometheus pushgateway (if configured via CI variable)
      if ($env:PUSHGATEWAY_URL) {
        try {
          Invoke-RestMethod -Uri "$env:PUSHGATEWAY_URL/metrics/job/vauchi_binary_size/platform/windows" `
            -Method Post -Body $promText -ContentType "text/plain" -ErrorAction Stop
          Write-Host "[metrics] Pushed to pushgateway"
        } catch {
          Write-Warning "[metrics] Pushgateway push failed (advisory): $_"
        }
      }
  artifacts:
    paths:
      - Vauchi/bin/x64/Release/
      - cabi/vauchi_cabi.dll
      - metrics.json
  tags: [windows, dotnet]

test:unit:
  stage: test
  needs:
    - job: build:app
      artifacts: true
  script:
    - $env:PATH = "$(Resolve-Path cabi);$env:PATH"
    - dotnet test Vauchi.UnitTests/Vauchi.UnitTests.csproj --logger "junit;LogFilePath=../../test-results/unit.xml"
  artifacts:
    when: always
    reports:
      junit: test-results/unit.xml
  tags: [windows, dotnet]

# Coverage: dotnet test with Coverlet collector (main merges only).
# Produces Cobertura XML for GitLab MR annotations and pushes metrics
# to Grafana Pushgateway.
coverage:unit:
  stage: test
  needs:
    - job: build:app
      artifacts: true
  script:
    - $env:PATH = "$(Resolve-Path cabi);$env:PATH"
    - |
      dotnet test Vauchi.UnitTests/Vauchi.UnitTests.csproj `
        --collect:"XPlat Code Coverage" `
        --results-directory coverage-results `
        --logger "junit;LogFilePath=../../test-results/coverage-unit.xml"
    - |
      # Find Cobertura XML (Coverlet outputs to a GUID subdirectory)
      $coberturaFile = Get-ChildItem -Path coverage-results -Recurse -Filter "coverage.cobertura.xml" | Select-Object -First 1
      if (-not $coberturaFile) {
        Write-Error "No Cobertura XML found"
        exit 1
      }
      Copy-Item $coberturaFile.FullName -Destination cobertura.xml
    - |
      # Extract coverage percentage for GitLab regex
      [xml]$cob = Get-Content cobertura.xml
      $lineRate = [double]$cob.coverage.'line-rate'
      $pct = [math]::Round($lineRate * 100, 2)
      Write-Host "Line Coverage: ${pct}%"
    - |
      # Push to Grafana Pushgateway (best-effort)
      $linesValid = $cob.coverage.'lines-valid'
      $linesCovered = $cob.coverage.'lines-covered'
      $metrics = @(
        "vauchi_eng_coverage_percent{repo=`"windows`"} $pct"
        "vauchi_eng_coverage_lines_valid{repo=`"windows`"} $linesValid"
        "vauchi_eng_coverage_lines_covered{repo=`"windows`"} $linesCovered"
      ) -join "`n"
      if ($env:PUSHGATEWAY_URL) {
        try {
          Invoke-RestMethod -Uri "$env:PUSHGATEWAY_URL/metrics/job/vauchi_coverage/repo/windows" `
            -Method Post -Body $metrics -ContentType "text/plain" -ErrorAction Stop
          Write-Host "[metrics] Coverage pushed to pushgateway"
        } catch {
          Write-Warning "[metrics] Pushgateway push failed (advisory): $_"
        }
      }
  coverage: '/Line Coverage:\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml
    paths:
      - cobertura.xml
    expire_in: 1 week
  tags: [windows, dotnet]
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ============================================================
# Security Stage
# ============================================================

semgrep-sast:
  allow_failure: false
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.cs"
          - "**/*.xaml"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

secret_detection:
  allow_failure: false
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Visual snapshot tests — capture each screen, compare against baselines.
# Requires Debug build (--reset-for-testing) and desktop session.
# Manual: SaaS runners may lack a desktop session for UI rendering.
# Shared launchable-app build for the jobs that run Vauchi.exe on a
# runner: test:snapshots and test:screen-catalog. Produces
# build/snapshot-app with the App SDK runtime, the CABI DLL and the
# Visual C++ runtime in place.
.snapshot-app-build:
  script:
    # The .NET-Core MSBuild behind `dotnet build`/`dotnet publish` skips the
    # App SDK's self-contained copy step, and the SaaS Windows image has no
    # Visual Studio MSBuild (pipelines 2841435588 and 2841492150). Do what
    # that step does: unpack the framework package the NuGet cache already
    # holds next to the executable. If no package is found, install the
    # runtime on the machine instead, which framework-dependent apps accept.
    - dotnet publish Vauchi/Vauchi.csproj -c Debug -r win-x64 --self-contained -p:Platform=x64 -p:EnableCoreMrtTooling=false -p:AppxGeneratePriEnabled=false -o build/snapshot-app
    - |
      $outDir = Join-Path $env:CI_PROJECT_DIR 'build\snapshot-app'
      $packages = Join-Path $env:USERPROFILE '.nuget\packages\microsoft.windowsappsdk'
      # The framework package is Microsoft.WindowsAppRuntime.<major>.<minor>.msix;
      # the Singleton, Main and DDLM packages beside it hold no runtime DLLs.
      $msix = Get-ChildItem -Path $packages -Recurse -Filter 'Microsoft.WindowsAppRuntime.*.msix' -ErrorAction SilentlyContinue |
        Where-Object { $_.FullName -match 'win10-x64' -and $_.Name -match '^Microsoft\.WindowsAppRuntime\.[0-9]+\.[0-9]+\.msix$' } |
        Sort-Object FullName -Descending | Select-Object -First 1
      if ($msix) {
        Write-Host "[snapshots] Unpacking framework package $($msix.FullName)"
        $zip = Join-Path $env:TEMP 'windowsappruntime.zip'
        Copy-Item $msix.FullName $zip -Force
        try {
          Expand-Archive -Path $zip -DestinationPath $outDir -Force -ErrorAction Stop
          Write-Host "[snapshots] Unpacked $((Get-ChildItem $outDir -Filter 'Microsoft.*.dll').Count) Microsoft.*.dll files"
        } catch {
          Write-Host "[snapshots] Expand-Archive failed: $_"
        }
      } else {
        Write-Host "[snapshots] No framework package in $packages; installing the Windows App Runtime"
        Invoke-WebRequest -Uri 'https://aka.ms/windowsappsdk/1.7/latest/windowsappruntimeinstall-x64.exe' -OutFile windowsappruntimeinstall-x64.exe
        Start-Process -FilePath .\windowsappruntimeinstall-x64.exe -ArgumentList '--quiet', '--force' -Wait
      }
      Write-Host "[snapshots] App SDK runtime files next to the app:"
      Get-ChildItem $outDir -Filter 'Microsoft.WindowsAppRuntime*.dll' | ForEach-Object { Write-Host "  $($_.Name)" }
    - Copy-Item cabi/vauchi_cabi.dll -Destination build/snapshot-app -Force
    # Microsoft.WindowsAppRuntime.dll links the whole Visual C++ runtime
    # (msvcp140, vcruntime140, vcruntime140_1); with only vcruntime140 on
    # the SaaS image the loader still reports the App SDK DLL as missing
    # (pipeline 2841637078). Install the redistributable every time.
    - |
      $crt = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
      Write-Host "[snapshots] Visual C++ runtime in System32 before install: $(($crt | ForEach-Object { "$_=$(Test-Path (Join-Path 'C:\Windows\System32' $_))" }) -join ' ')"
      Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile vc_redist.x64.exe
      Start-Process -FilePath .\vc_redist.x64.exe -ArgumentList '/install', '/quiet', '/norestart' -Wait
      Write-Host "[snapshots] Visual C++ runtime in System32 after install: $(($crt | ForEach-Object { "$_=$(Test-Path (Join-Path 'C:\Windows\System32' $_))" }) -join ' ')"

test:snapshots:
  stage: test
  needs: []
  cache:
    key:
      files:
        - cabi-version.json
    paths:
      - cabi/
    policy: pull
  before_script:
    - !reference [.cabi-download-script, script]
  variables:
    VRT_PLATFORM: windows
    VRT_SCREENSHOT_DIR: tests/snapshots/actual
  script:
    - !reference [.snapshot-app-build, script]
    - |
      $outDir = Join-Path $env:CI_PROJECT_DIR 'build\snapshot-app'
      Write-Host "[snapshots] $((Get-ChildItem $outDir -Filter '*.dll').Count) DLLs next to the app; App SDK ones:"
      Get-ChildItem $outDir -Filter 'Microsoft.*.dll' | ForEach-Object { Write-Host "  $($_.Name)" }
      Write-Host "[snapshots] manifest next to the app: $(Test-Path (Join-Path $outDir 'Vauchi.exe.manifest'))"
      # Resolve the loader failure to the exact module: LoadLibrary the DLL
      # and each of its imports (api-set names resolve only through the
      # loader). One-line member definition: a PowerShell here-string cannot
      # close inside an indented YAML block.
      Add-Type -Namespace Probe -Name Native -MemberDefinition '[System.Runtime.InteropServices.DllImport("kernel32.dll", SetLastError = true, CharSet = System.Runtime.InteropServices.CharSet.Unicode)] public static extern System.IntPtr LoadLibraryExW(string path, System.IntPtr file, uint flags);'
      Write-Host "[snapshots] OS: $([System.Environment]::OSVersion.VersionString)"
      # RoMetadata.dll failed with error 126 on pipeline 2842094916; it is a
      # desktop-SKU Windows component, so tell a Server Core image apart from
      # one that merely lacks a file.
      $levels = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Server\ServerLevels' -ErrorAction SilentlyContinue
      Write-Host "[snapshots] ServerLevels: ServerCore=$($levels.ServerCore) Server-Gui-Shell=$($levels.'Server-Gui-Shell') explorer.exe=$(Test-Path 'C:\Windows\explorer.exe') RoMetadata.dll=$(Test-Path 'C:\Windows\System32\RoMetadata.dll')"
      Get-ChildItem $outDir | Select-Object -First 60 | ForEach-Object { Write-Host "[snapshots]   file: $($_.Name)" }
      $runtime = Join-Path $outDir 'Microsoft.WindowsAppRuntime.dll'
      Write-Host "[snapshots] runtime present: $(Test-Path $runtime)"
      $handle = [Probe.Native]::LoadLibraryExW($runtime, [System.IntPtr]::Zero, [uint32]0x1100)
      $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
      Write-Host "[snapshots] LoadLibraryEx(runtime): handle=$handle error=$err"
      foreach ($dep in @('RoMetadata.dll', 'XmlLite.dll', 'USERENV.dll', 'api-ms-win-appmodel-runtime-l1-1-1.dll', 'api-ms-win-power-setting-l1-1-1.dll', 'api-ms-win-power-base-l1-1-0.dll', 'api-ms-win-ro-typeresolution-l1-1-0.dll', 'api-ms-win-core-winrt-l1-1-0.dll', 'api-ms-win-crt-runtime-l1-1-0.dll')) {
        $h = [Probe.Native]::LoadLibraryExW($dep, [System.IntPtr]::Zero, [uint32]0)
        $e = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
        Write-Host "[snapshots]   $dep handle=$h error=$e"
      }
    - powershell -ExecutionPolicy Bypass -File tests/capture-snapshots.ps1 -AppPath build/snapshot-app/Vauchi.exe
  after_script:
    - !reference [.vrt-upload-script, script]
  artifacts:
    when: always
    paths:
      - tests/snapshots/actual/
    expire_in: 7 days
  tags: [windows, dotnet]
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Replays Core's screen catalog (every app screen as a Command batch)
# through the real WinUI renderer to PNG files. Needs a desktop-capable
# Windows runner: saas-windows-medium-amd64 is a Server Core image
# without explorer.exe or RoMetadata.dll, so the Windows App SDK cannot
# load there and this job only produces images once it moves to the
# self-hosted desktop runner the fleet rebuild adds — see
# _private/docs/backlog/2026-09-11-windows-screenshot-capture-needs-desktop-runner.
test:screen-catalog:
  stage: test
  needs: []
  timeout: 40m
  cache:
    key:
      files:
        - cabi-version.json
    paths:
      - cabi/
    policy: pull
  before_script:
    - !reference [.cabi-download-script, script]
  variables:
    VRT_PLATFORM: windows
    VRT_SCREENSHOT_DIR: build/screen-catalog
  script:
    - !reference [.snapshot-app-build, script]
    # Core main is the catalog's source of truth. Until it publishes
    # screen_catalog_v1.json, fold presentation_contract_v1.json (the
    # same batch shape: initial_commands plus one batch per step) into a
    # catalog so the renderer still exercises every code path.
    - |
      $catalog = Join-Path $env:CI_PROJECT_DIR 'build\screen_catalog_v1.json'
      $coreFiles = "$env:CI_API_V4_URL/projects/vauchi%2Fcore/repository/files"
      $headers = @{ 'JOB-TOKEN' = $env:CI_JOB_TOKEN }
      try {
        Invoke-WebRequest -Headers $headers -Uri "$coreFiles/vauchi-app%2Ffixtures%2Fscreen_catalog_v1.json/raw?ref=main" -OutFile $catalog -ErrorAction Stop
        Write-Host "[screen-catalog] catalog source: core main vauchi-app/fixtures/screen_catalog_v1.json"
      } catch {
        Write-Host "[screen-catalog] core main has no screen_catalog_v1.json ($($_.Exception.Message)); converting presentation_contract_v1.json"
        $contractPath = Join-Path $env:CI_PROJECT_DIR 'build\presentation_contract_v1.json'
        Invoke-WebRequest -Headers $headers -Uri "$coreFiles/vauchi-app%2Ffixtures%2Fpresentation_contract_v1.json/raw?ref=main" -OutFile $contractPath -ErrorAction Stop
        $contract = Get-Content $contractPath -Raw | ConvertFrom-Json
        $screens = @(@{ code_id = 'contract_initial'; title = 'Contract initial'; locale = 'en'; commands = $contract.initial_commands })
        $step = 0
        foreach ($entry in $contract.steps) {
          $step++
          $screens += @{ code_id = "contract_step_$step"; title = "Contract step $step"; locale = 'en'; commands = $entry.commands }
        }
        @{ schema_version = 1; screens = $screens } | ConvertTo-Json -Depth 100 | Set-Content $catalog -Encoding UTF8
        Write-Host "[screen-catalog] catalog source: presentation_contract_v1.json folded into $($screens.Count) screens"
      }
    - |
      $outDir = Join-Path $env:CI_PROJECT_DIR 'build\screen-catalog'
      $catalog = Join-Path $env:CI_PROJECT_DIR 'build\screen_catalog_v1.json'
      New-Item -ItemType Directory -Force -Path $outDir | Out-Null
      $app = Join-Path $env:CI_PROJECT_DIR 'build\snapshot-app\Vauchi.exe'
      $proc = Start-Process -FilePath $app -ArgumentList '--render-catalog', "`"$catalog`"", "`"$outDir`"" -PassThru
      if (-not $proc.WaitForExit(600000)) {
        $proc.Kill()
        Write-Host "[screen-catalog] Vauchi.exe did not finish within 600 s"
        exit 1
      }
      $log = Join-Path $outDir 'render-catalog.log'
      if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
      $count = (Get-ChildItem $outDir -Filter '*.png' -ErrorAction SilentlyContinue | Measure-Object).Count
      Write-Host "[screen-catalog] exit code $($proc.ExitCode); $count PNG files in $outDir"
      # `exit`, not `throw`: an uncaught throw inside a multi-line block
      # prints the error yet leaves the runner step's status at 0, so
      # job 16457763478 passed with zero images.
      if ($proc.ExitCode -ne 0) { exit 1 }
  after_script:
    - !reference [.vrt-upload-script, script]
  artifacts:
    when: always
    paths:
      - build/screen-catalog/
    expire_in: 7 days
  tags: [saas-windows-medium-amd64]
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Record new baselines — manual job, commits via PROJECT_ACCESS_TOKEN.
test:snapshots:record:
  stage: test
  needs: []
  cache:
    key:
      files:
        - cabi-version.json
    paths:
      - cabi/
    policy: pull
  before_script:
    - !reference [.cabi-download-script, script]
  script:
    - dotnet build Vauchi/Vauchi.csproj -c Debug -p:Platform=x64 -p:EnableCoreMrtTooling=false -p:AppxGeneratePriEnabled=false
    - |
      $debugDir = "Vauchi\bin\x64\Debug\net8.0-windows10.0.22621.0\win-x64"
      Copy-Item cabi/vauchi_cabi.dll -Destination $debugDir -Force
    - powershell -ExecutionPolicy Bypass -File tests/capture-snapshots.ps1 -UpdateBaselines
    - |
      git config user.name "vauchi-bot"
      git config user.email "bot@vauchi.app"
      git add tests/snapshots/baseline/*.png
      $changes = git diff --cached --name-only
      if ($changes) {
        git commit -m "test: update Windows snapshot baselines [skip ci]"
        git push "https://project-access-token:$env:PROJECT_ACCESS_TOKEN@gitlab.com/vauchi/windows.git" HEAD:$env:CI_COMMIT_REF_NAME
      } else {
        Write-Host "No baseline changes to commit"
      }
  tags: [windows, dotnet]
  when: manual
  allow_failure: true

# Design drift: verify all design-spec components are implemented
test:a11y:
  stage: test
  script:
    # Suppress PRI tooling exactly like build:app + test:snapshots:record do.
    # Without these flags, MRT restore fails with MSB4062 on SaaS Windows
    # runners whose SDK layout lacks Microsoft.Build.Packaging.Pri.Tasks.dll.
    # See 2026-04-20-windows-test-jobs-broken.
    # No name filter: Vauchi.Tests holds only WinUI-app-context tests
    # (accessibility). Headless unit tests live in Vauchi.UnitTests (test:unit).
    # A name filter here once hid SmokeTests from every lane — see
    # 2026-06-11-e2e-tests-invisible-to-ci (windows instance).
    # -r win-x64: WinUI test projects need a RID so the testhost output carries
    # the test-platform assemblies (see Vauchi.Tests.csproj + 2026-04-20 record).
    - dotnet test Vauchi.Tests/Vauchi.Tests.csproj -r win-x64 -p:EnableCoreMrtTooling=false -p:AppxGeneratePriEnabled=false
  tags: [windows, dotnet]
  when: manual

check:design-drift:
  extends: .design-drift-job
  variables:
    DESIGN_DRIFT_PROTOCOL: "presentation"
    DESIGN_DRIFT_MATCH_MODE: "grep"
    DESIGN_DRIFT_GREP_FILE: "Vauchi/CoreUI"
    CORE_REF: "v0.59.0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "Vauchi/CoreUI/PresentationSurface*.cs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "Vauchi/CoreUI/PresentationSurface*.cs"
          - ".gitlab-ci.yml"

# Parser-parity gate for Core's canonical PresentationNode enum.
check:parser-parity:
  extends: .parser-parity-job
  variables:
    FRONTEND_NAME: "windows"
    PARSER_FILE: "Vauchi/CoreUI/PresentationSurface.cs"
    PARSER_PROTOCOL: "presentation"
    PARSER_SCRIPT_REF: "ci-templates-v2026.07.12"
    CORE_REF: "v0.59.0"

# Removed symbols: detect stale references to removed features
check:removed-symbols:
  extends: .removed-symbols-job
  variables:
    SEARCH_DIRS: "Vauchi/"

# Humble-UI ratchet: block new domain-named MainWindow.<Domain>.cs
# partials. Per ADR-021/043, MainWindow's logic should live in
# Handlers/* (non-partial), Helpers/*, or inlined into MainWindow.xaml.cs
# — never in domain-shaped partials like MainWindow.Backup.cs /
# MainWindow.Exchange.cs. Phases 1-4 of
# `2026-05-02-windows-humble-ui-retirement` retired the four
# pre-existing partials; this gate prevents regressions.
# Cross-cutting lint bundle: combines the previously separate
# check:no-domain-partials, check:design-tokens, and lint:humble jobs.
# All three are blocking checks, so they run sequentially in a single
# docker job to reduce runner cold-starts and queue time.
lint:cross-cutting-blocking:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim
  tags: [docker]
  needs: []
  allow_failure: false
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends findutils grep gawk curl ca-certificates bash
    - mkdir -p .ratchet-scripts
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check.py/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check.py
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check_rules.json/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check_rules.json
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check.baseline.json/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check.baseline.json
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fcheck-design-tokens.sh/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o check-design-tokens.sh
      chmod +x check-design-tokens.sh
  script:
    # check:no-domain-partials: block domain-named MainWindow.<Domain>.cs partials.
    - |
      partials="$(find Vauchi -maxdepth 1 -type f -name 'MainWindow.*.cs' \
                       -not -name 'MainWindow.xaml.cs' 2>/dev/null || true)"
      if [ -n "$partials" ]; then
        echo "FAIL: domain-named MainWindow.<Domain>.cs partials found:"
        echo "$partials" | awk '{print "  " $0}'
        echo
        echo "Per ADR-021/043 (Humble UI), MainWindow logic must live in:"
        echo "  - Vauchi/Handlers/*Handler.cs (non-partial classes), or"
        echo "  - Vauchi/Helpers/*.cs (small static utilities), or"
        echo "  - Vauchi/MainWindow.xaml.cs (when inlining is simpler)."
        echo
        echo "Domain-shaped partials force parallel maintenance per domain"
        echo "and were retired by 2026-05-02-windows-humble-ui-retirement."
        exit 1
      fi
      echo "OK: only Vauchi/MainWindow.xaml.cs present (no domain partials)"
    # check:design-tokens: block raw Colors.* / Color.FromArgb / hex literals.
    - ./check-design-tokens.sh --strict Vauchi/
    # lint:humble: block domain logic / vocabulary leaks into the view layer.
    - python3 .ratchet-scripts/humble_check.py --repo "${CI_PROJECT_NAME}" --repo-path "${CI_PROJECT_DIR}" --config .ratchet-scripts/humble_check_rules.json --check .ratchet-scripts/humble_check.baseline.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.cs"
          - "**/*.xaml"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

package:msix:
  stage: deploy
  tags: [windows, dotnet]
  needs: ["build:app"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - $VERSION = "$env:CI_COMMIT_TAG" -replace '^v', ''
    - >
      dotnet publish Vauchi.sln -c Release
      -p:Platform=x64
      -o publish-output
    - >
      & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\MakeAppx.exe"
      pack /d publish-output /p "Vauchi-${VERSION}.msix" /nv
  artifacts:
    paths:
      - "Vauchi-*.msix"
    expire_in: 1 week

pages:
  extends: .badges-pages

github-mirror:
  extends: .github-mirror
